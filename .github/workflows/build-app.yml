name: Build Loop Studio apps

on:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/build-app.yml'
  workflow_dispatch:

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app/desktop
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Copy the app page
        shell: bash
        run: mkdir -p www && cp ../www/index.html www/index.html
      - name: Add the native audio engine (latest Loop Engine build)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p engine-bin
          if [ "$RUNNER_OS" = "Windows" ]; then ASSET=LoopEngine-Windows.zip; else ASSET=LoopEngine-macOS.zip; fi
          if gh release download engine-latest --repo "$GITHUB_REPOSITORY" --pattern "$ASSET" --dir engine-dl; then
            unzip -o engine-dl/"$ASSET" -d engine-bin
            ls -la engine-bin
          else
            echo "No engine build yet: the app is built without it"
            echo "none" > engine-bin/README.txt
          fi
      - name: Install
        run: npm install
      - name: Build
        run: npx electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: LoopStudio-${{ runner.os }}
          path: |
            app/desktop/dist/*.exe
            app/desktop/dist/*.dmg
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Copy the app page
        run: mkdir -p www && cp ../www/index.html www/index.html
      - name: Install
        run: npm install
      - name: Create the Android project
        run: npx cap add android
      - name: Landscape only
        run: |
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
          grep -n "screenOrientation" android/app/src/main/AndroidManifest.xml
      - name: Full screen and microphone
        run: |
          mkdir -p android/app/src/main/java/com/loopstudio/app
          cat > android/app/src/main/java/com/loopstudio/app/MainActivity.java <<'EOF'
          package com.loopstudio.app;

          import android.graphics.Color;
          import android.graphics.drawable.ColorDrawable;
          import android.os.Bundle;
          import android.view.WindowManager;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              getWindow().setBackgroundDrawable(new ColorDrawable(Color.parseColor("#141518")));
              hideBars();
            }

            @Override
            public void onWindowFocusChanged(boolean hasFocus) {
              super.onWindowFocusChanged(hasFocus);
              if (hasFocus) hideBars();
            }

            private void hideBars() {
              WindowInsetsControllerCompat c = WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
              c.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
              c.hide(WindowInsetsCompat.Type.systemBars());
            }
          }
          EOF
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <application#' android/app/src/main/AndroidManifest.xml
          grep -n "RECORD_AUDIO\|<application" android/app/src/main/AndroidManifest.xml
      - name: Copy page into the project
        run: npx cap sync android
      - name: Build APK
        working-directory: app/android/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Name the file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Loop-Studio.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LoopStudio-Android
          path: app/android/Loop-Studio.apk
          if-no-files-found: error

  release:
    needs: [desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - run: ls -la files
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: Loop Studio apps (latest build)
          body: |
            Latest build of Loop Studio. Download the file for your device:
            - Windows: the .exe (installer) or the portable .exe
            - macOS: the .dmg
            - Android: Loop-Studio.apk
          files: files/*
