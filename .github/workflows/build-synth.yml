name: Build Loop Synth

on:
  push:
    paths:
      - 'synth/**'
      - '.github/workflows/build-synth.yml'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S synth -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Collect (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item -Recurse "build/LoopSynth_artefacts/Release/VST3/*" out/
          Copy-Item -Recurse "build/LoopSynth_artefacts/Release/Standalone/*" out/ -ErrorAction SilentlyContinue

      - name: Collect (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p out
          cp -R build/LoopSynth_artefacts/Release/VST3/* out/
          cp -R build/LoopSynth_artefacts/Release/Standalone/* out/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: LoopSynth-${{ runner.os }}
          path: out

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
      - name: Zip
        run: |
          mkdir -p out
          for d in files/*; do n=$(basename "$d"); (cd "$d" && zip -qr "$GITHUB_WORKSPACE/out/$n.zip" .); done
          ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: synth-latest
          name: Loop Synth plugin (latest build)
          body: |
            Latest build of the Loop Synth plugin (VST3 plus stand-alone program).
            Unzip, copy the Loop Synth.vst3 folder into your VST3 folder and rescan plugins in your DAW.
          files: out/*
