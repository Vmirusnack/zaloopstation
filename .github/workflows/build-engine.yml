name: Build Loop Engine

on:
  push:
    paths:
      - 'engine/**'
      - 'synth/Source/Dsp.h'
      - '.github/workflows/build-engine.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Engine tests (no audio device needed)
        run: |
          g++ -O2 -std=c++17 engine/test/core_test.cpp -o core_test && ./core_test
          g++ -O2 -std=c++17 engine/test/fx_test.cpp -o fx_test && ./fx_test
          g++ -O2 -std=c++17 synth/test/dsp_test.cpp -o dsp_test && ./dsp_test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S engine -B build -DCMAKE_BUILD_TYPE=Release ${{ runner.os == 'macOS' && '"-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"' || '' }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Collect (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item "build/LoopEngine_artefacts/Release/LoopEngine.exe" out/

      - name: Collect (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p out
          cp build/LoopEngine_artefacts/Release/LoopEngine out/

      - uses: actions/upload-artifact@v4
        with:
          name: LoopEngine-${{ runner.os }}
          path: out

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
      - name: Zip
        run: |
          mkdir -p out
          for d in files/*; do n=$(basename "$d"); (cd "$d" && zip -qr "$GITHUB_WORKSPACE/out/$n.zip" .); done
          ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: engine-latest
          name: Loop Engine (latest build)
          body: |
            Latest build of the Loop Engine, the native audio engine of Loop Studio (development build, stage 1).
            Run LoopEngine; it plays the project it is sent over a local TCP socket (127.0.0.1:47821, one JSON message per line).
          files: out/*
